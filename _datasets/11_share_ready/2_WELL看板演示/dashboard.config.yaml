version: 2
title: 浙江移动 · 管线井（WELL）资源分析看板
metrics:
- id: total
  name: 管线井总数
  direction: up
  unit: 座
  caliber: 总井数
  source:
    table: ads_well_summary
    column: total_wells
- id: zw
  name: 在网占比
  direction: up
  unit: '%'
  caliber: 在网占比
  source:
    table: ads_well_summary
    column: zaiwang_pct
- id: zwcnt
  name: 在网井数
  direction: up
  unit: 座
  caliber: 在网井数
  source:
    table: ads_well_summary
    column: zaiwang_cnt
- id: loc
  name: 含坐标井
  direction: up
  unit: 座
  caliber: 含坐标井
  source:
    table: ads_well_summary
    column: has_location
components:
- id: k1
  type: kpi
  metric: total
- id: k2
  type: kpi
  metric: zw
- id: k3
  type: kpi
  metric: zwcnt
- id: k4
  type: kpi
  metric: loc
- id: h1
  type: heading
  content: 一、构成分析（图例均为官方中文名，码值含义见文末字典）
- id: p1
  type: pie
  metric: cnt
  table: ads_lifecycle
  dimension: lifecyclestatus
  label: 生命周期状态构成
  order: cnt DESC
- id: p2
  type: pie
  metric: cnt
  table: ads_property_cat
  dimension: propertycategory
  label: 产权性质构成（码值待确认）
- id: b1
  type: bar
  metric: cnt
  table: ads_city
  dimension: city
  label: 地市分布（解析自井名称）
  order: cnt DESC
  top: 12
- id: b2
  type: bar
  metric: cnt
  table: ads_virtual_cat
  dimension: virtualcategory
  label: 显示类别分布（码值待确认）
- id: p3
  type: pie
  metric: cnt
  table: ads_firstwell
  dimension: firstwell
  label: 是否局前井
- id: p4
  type: pie
  metric: cnt
  table: ads_forbidden
  dimension: forbidden
  label: 是否标记禁用
- id: b3
  type: bar
  metric: cnt
  table: ads_county
  dimension: county
  label: 区县分布 Top12（解析自井名称）
  order: cnt DESC
  top: 12
- id: b4
  type: bar
  metric: cnt
  table: ads_year
  dimension: yr
  label: 入网年份分布（按入网时间聚合）
  order: yr ASC
  top: 20
- id: h2
  type: heading
  content: 二、码值字典与数据说明（发给同事前请先读这里）
- id: tb
  type: table
  table: ads_codebook
  columns:
  - fld
  - val
  - meaning
  - basis
  top: 15
  title: 码值字典（官方备注 + 待确认项）
- id: tx
  type: text
  content: 数据说明：来源 D:/你的数据/ZJsftp/IRM_IV_WELL_D（7 个 CSV.GZ 分片，2026-09-14 导出），共 1,409,711
    条 × 130 字段，字段中文名取自《4个哑资源视图1204》官方字典。如何解读：生命周期状态按官方备注翻译（1规划/2设计/3工程/4在网/5维护/6退网），本库
    93.4% 在网；地市/区县分布从井名称解析真实地名；显示类别、产权性质的码值系统未提供含义，需业务方确认后更新码值字典重出看板。如何转发：本文件为单文件离线网页，直接用微信/邮件发送，对方双击用浏览器打开即可，无需安装软件；L3
    下钻明细基于前 5 万行抽样。
drill:
  l2:
    dimensions:
    - table: ads_lifecycle
      dimension: lifecyclestatus
      label: 按生命周期
      order: cnt DESC
    - table: ads_city
      dimension: city
      label: 按地市
      order: cnt DESC
    - table: ads_county
      dimension: county
      label: 按区县
      order: cnt DESC
    - table: ads_property_cat
      dimension: propertycategory
      label: 按产权性质
      order: cnt DESC
  l3:
    table: dwd_well
    columns:
    - ID
    - NAME
    - LIFECYCLESTATUS
    - VIRTUALCATEGORY
    - CITY_P
    - COUNTY_P
    - ONLINEDATE
    - NFCID
    dimension_map:
      lifecyclestatus: LIFECYCLESTATUS
      virtualcategory: VIRTUALCATEGORY
      propertycategory: PROPERTYCATEGORY
      city: CITY_P
      county: COUNTY_P
    limit: 200

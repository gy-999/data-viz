version: 2
title: 浙江移动 · ODF 光配线架资源分析看板
metrics:
- id: total
  name: ODF总数
  direction: up
  unit: 架
  caliber: ODF总数
  source:
    table: ads_res_summary
    column: total_cnt
- id: zw
  name: 在网占比
  direction: up
  unit: '%'
  caliber: 在网占比
  source:
    table: ads_res_summary
    column: zaiwang_pct
- id: nfc
  name: 已贴标签数
  direction: up
  unit: 架
  caliber: 已贴标签数
  source:
    table: ads_res_summary
    column: nfc_cnt
- id: cityc
  name: 覆盖地市
  direction: up
  unit: 个
  caliber: 覆盖地市
  source:
    table: ads_res_summary
    column: city_cnt
components:
- id: k1
  type: kpi
  metric: total
- id: k2
  type: kpi
  metric: zw
- id: k3
  type: kpi
  metric: nfc
- id: k4
  type: kpi
  metric: cityc
- id: h1
  type: heading
  content: 一、构成分析（图例均为官方中文名，码值见文末字典）
- id: p1
  type: pie
  metric: cnt
  table: ads_lifecycle
  dimension: lifecyclestatus
  label: 生命周期状态构成
  order: cnt DESC
- id: p2
  type: pie
  metric: cnt
  table: ads_nfc
  dimension: nfcstat
  label: NFC 标签覆盖
- id: b1
  type: bar
  metric: cnt
  table: ads_city
  dimension: city
  label: 地市分布（解析自名称）
  order: cnt DESC
- id: b2
  type: bar
  metric: cnt
  table: ads_county
  dimension: county
  label: 区县分布 Top12（解析自名称）
  order: cnt DESC
- id: b3
  type: bar
  metric: cnt
  table: ads_year
  dimension: yr
  label: 入网年份分布
  order: yr ASC
- id: h2
  type: heading
  content: 二、码值字典与数据说明（转发前请读）
- id: tb
  type: table
  table: ads_codebook
  columns:
  - fld
  - val
  - meaning
  - basis
  top: 10
  title: 码值字典
- id: tx
  type: text
  content: 数据说明：来源 D:/你的数据/ZJsftp/IRM_V_ODF_D，共 8,000 条 × 12 字段，字段中文名取自《4个哑资源视图1204》官方字典。ODF=光纤配线架。生命周期官方码值：1规划/2设计/3工程/4在网/5维护/6退网。如何转发：本文件为单文件离线网页，微信/邮件直发，对方双击浏览器打开即可；L3
    明细为前 8,000 行抽样。配套《ODF数据分析报告.docx》含完整口径卡与结论。
drill:
  l2:
    dimensions:
    - table: ads_lifecycle
      dimension: lifecyclestatus
      label: 按生命周期
      order: cnt DESC
    - table: ads_city
      dimension: city
      label: 按地市
      order: cnt DESC
    - table: ads_county
      dimension: county
      label: 按区县
      order: cnt DESC
  l3:
    table: dwd_odf
    columns:
    - ID
    - NAME
    - LIFECYCLESTATUS
    - EQUIPMENTTYPE
    - ONLINEDATE
    - NFCID
    - LONGITUDE
    - LATITUDE
    - CREATEDATE
    dimension_map:
      lifecyclestatus: LIFECYCLESTATUS
      city: CITY_P
      county: COUNTY_P
    limit: 200

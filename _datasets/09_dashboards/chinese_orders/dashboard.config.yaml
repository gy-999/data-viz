version: 2
title: 订单数据质量与统计分析看板 · 中文 GBK 订单表
time:
  table: ads_trend
  column: 月份
metrics:
- id: sales
  name: 销售额合计
  direction: up
  unit: 元
  caliber: 销售额合计
  source:
    table: ads_overview
    column: 值
    key:
      指标: 销售额合计
- id: rows
  name: 订单行数
  direction: up
  unit: 行
  caliber: 订单行数
  source:
    table: ads_overview
    column: 值
    key:
      指标: 订单行数
- id: cust
  name: 客户数
  direction: up
  unit: 人
  caliber: 客户数
  source:
    table: ads_overview
    column: 值
    key:
      指标: 客户数
- id: loss
  name: 亏损订单行数
  direction: down
  unit: 行
  caliber: 亏损订单行数
  source:
    table: ads_overview
    column: 值
    key:
      指标: 亏损订单行数
- id: msales
  name: 月度销售额
  direction: up
  unit: 元
  caliber: 月度趋势
  source:
    table: ads_trend
    column: 销售额
components:
- id: k1
  type: kpi
  metric: sales
- id: k2
  type: kpi
  metric: rows
- id: k3
  type: kpi
  metric: cust
- id: k4
  type: kpi
  metric: loss
- id: h1
  type: heading
  content: 一、趋势与构成
- id: l1
  type: line
  metrics:
  - msales
  label: 月度销售额趋势（⚠ 2024-03 存在日期压平，该点不可解释）
- id: p1
  type: pie
  metric: sales
  table: ads_category
  dimension: 维度
  label: 产品类别销售额构成
  order: 销售额 DESC
- id: p2
  type: pie
  metric: sales
  table: ads_customer_type
  dimension: 维度
  label: 客户类型销售额构成
  order: 销售额 DESC
- id: h2
  type: heading
  content: 二、排名与关键少数（帕累托 80/20）
- id: pa1
  type: pareto
  metric: sales
  table: ads_province
  dimension: 维度
  label: 省份销售额帕累托（找关键少数）
  order: 销售额 DESC
  top: 8
- id: pa2
  type: pareto
  metric: sales
  value_col: 销售额
  table: ads_discount
  dimension: 折扣档
  label: 折扣档位销售额帕累托
  order: 销售额 DESC
  top: 8
- id: t1
  type: table
  table: ads_customer
  columns:
  - 客户
  - 销售额
  - 行数
  top: 12
  title: 客户销售额 Top12
- id: h3
  type: heading
  content: 三、统计分析与分布诊断
- id: box1
  type: box
  table: dwd_orders
  dimension: 产品类别
  column: 销售额
  label: 销售额分布 · 按产品类别（箱线图，含离群点）
  top: 8
- id: qq1
  type: qq
  table: dwd_orders
  column: 利润
  label: 利润是否近似正态 · Q-Q 图
  top: 1500
- id: corr1
  type: corr
  table: dwd_orders
  columns:
  - 销售额
  - 数量
  - 折扣
  - 利润
  method: spearman
- id: reg1
  type: regress
  table: dwd_orders
  x: 销售额
  y: 利润
  label: 利润 ~ 销售额 回归
  top: 1500
- id: hist1
  type: histogram
  table: dwd_orders
  column: 销售额
  label: 销售额分布直方图
  bins: 24
- id: h4
  type: heading
  content: 四、数据质量画像
- id: miss1
  type: missing
  table: dwd_orders
  dimension: 产品类别
  label: 缺失值画像（整体 Top 字段 + 分组对比）
  col_top: 12
- id: tx1
  type: text
  content: 数据说明：源文件 chinese_orders_gbk.csv（GBK 编码，4000 行 × 12 列）。本看板按 SKILL.md v3
    流程产出：AI 直读探源（编码级联→GBK、空串=缺失、订单号重复 2075 行、1243 行日期被压平、折扣列 1047 行字面 None）→ 口径卡 →
    用户选单 → 声明式配置 → 渲染 → 闸门。统计图由引擎本地计算：箱线图用线性插值四分位 + 1.5×IQR 离群点；Q-Q 用 Acklam 正态分位数；相关矩阵为斯皮尔曼秩相关；回归给出斜率/截距/R²。转发：单文件离线网页，双击即看。
drill:
  l2:
    dimensions:
    - table: ads_category
      dimension: 维度
      label: 按产品类别
      order: 销售额 DESC
    - table: ads_customer_type
      dimension: 维度
      label: 按客户类型
      order: 销售额 DESC
    - table: ads_province
      dimension: 维度
      label: 按省份
      order: 销售额 DESC
    - table: ads_city
      dimension: 维度
      label: 按城市
      order: 销售额 DESC
  l3:
    table: dwd_orders
    columns:
    - 订单号
    - 订单日期
    - 客户
    - 城市
    - 产品类别
    - 销售额
    - 利润
    dimension_map: {}
    limit: 200
